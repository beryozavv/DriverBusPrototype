syntax = "proto3";

package crosstech.dss;

service FilterDriver {
    rpc SendCommand (stream CommandResult) returns (stream Command);
    rpc GetRequest (stream BusRequest) returns (stream BusResponse);
}

message Command {
  string command = 1;
}

message CommandResult {
  string result = 1;
}

message BusRequest{
  string busRequest = 1;
}

message BusResponse{
  string busResponse = 1;
}
